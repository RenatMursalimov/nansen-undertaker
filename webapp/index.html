<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nansen Undertaker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!--
  miniapp_nansen — ТРИ ЭКРАНА NANSEN НА ТЕЛЕФОНЕ.

  ЗАКОН 0: ЭТА СТРАНИЦА НИЧЕГО НЕ СЧИТАЕТ. Все числа приезжают готовым словарём сцены от
  бота (`nansen_scene` -> `nansen_gate`), и под каждым графиком показывается `rendered_text` -
  РОВНО та фраза, которую человек увидел бы в чате. Посчитай страница хоть один процент сама,
  и на первой правке бот сказал бы 58%, а картинка нарисовала 61%; расхождение молчаливое, и
  увидел бы его судья, а не мы.

  ЧЕГО ЗДЕСЬ НЕТ НАРОЧНО:
    * библиотек графиков. SVG строится руками, потому что три экрана - это прямоугольники и
      подписи, а любая библиотека тянет вес и свою модель данных;
    * ключа Nansen и адресов площадки. Страница знает только адрес почтового ящика;
    * полных адресов кошельков. Шлюз их вычищает (`_strip_private`), и экран показывает то же,
      что бот: метку или обрезанный адрес;
    * своих порогов. Порог винрейта и порог «доли от капитализации» приезжают числом.
-->
<style>
  /* ═══ ПАЛИТРА: ФИОЛЕТОВЫЙ ФОН «ХАРМЫ» + ЗЕЛЁНЫЙ АКЦЕНТ NANSEN ═══
     Просьба владельца: экран должен читаться как наш (комнаты «Харма» - глубокий фиолетовый)
     и как Nansen (их зелёный). Поэтому фон и карточки фиолетовые, а ЗЕЛЁНЫМ окрашено только
     то, что означает данные Nansen: акцент активного таба, «сильные/острые деньги», короткая
     сторона. Цвет здесь НЕСЁТ СМЫСЛ, и это ограничение сильнее вкуса: раскрасить зелёным всё
     подряд значит отнять у зелёного значение, а вместе с ним и у легенды. */
  :root{
    --bg:#150b2e; --bg2:#12092a; --bg3:#1b0f3a;
    --card:#221244; --card2:#190c37; --line:#3a2168; --line2:#4a2c82;
    --ink:#f3eeff; --dim:#b4a3dd;
    --nsn:#00d395;       /* зелёный Nansen: акцент и «данные Nansen» */
    --nsn-d:#0a8f6a;     /* его тёмный оттенок для рамок/подложек */
    --weak:#ff6b81;      /* винрейт ниже порога — «деньги тех, кто чаще ошибался» */
    --mid:#ffc24d;       /* середина */
    --strong:#00d395;    /* винрейт выше порога — тот же зелёный, что у бренда данных */
    --grey:#6b5f90;      /* ИСТОРИЯ НЕ РАЗОБРАНА: не «слабые» и не «сильные» */
    --long:#ff6b81; --short:#00d395;
    --named:#49c8ff;     /* деньги с меткой Nansen внутри столбика: ТОТ ЖЕ цвет, что на
                            картинке в чате, и НЕ цвет пунктира текущей цены - один цвет
                            обязан означать одну величину на обоих экранах */
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);
       background:var(--bg);
       background-image:linear-gradient(180deg,var(--bg3) 0,var(--bg) 38%,var(--bg2) 100%);
       background-attachment:fixed;
       font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:0 0 28px;-webkit-text-size-adjust:100%}
  .wrap{padding:12px 12px 0}
  /* ШАПКА: чей экран и ЧЬИ ДАННЫЕ. Вторая половина здесь не украшение - на экране, который
     показывают судьям, источник обязан быть виден без чтения подвала. */
  .top{display:flex;align-items:center;gap:8px;padding:10px 12px 2px}
  .top .ttl{font-size:14px;font-weight:700;letter-spacing:.2px}
  .top .by{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;
           color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
  .top .by b{color:var(--nsn);letter-spacing:1.4px}
  .top .by{text-decoration:none}
  .mark{flex:0 0 auto;filter:drop-shadow(0 0 6px rgba(0,211,149,.35))}
  .tabs{display:flex;gap:6px;position:sticky;top:0;padding:10px 12px;
        background:rgba(21,11,46,.92);backdrop-filter:blur(6px);
        z-index:5;border-bottom:1px solid var(--line)}
  /* ПОДПИСИ ТАБОВ СТОЯТ НА ОДНОМ УРОВНЕ ДАЖЕ КОГДА ОДНА ИЗ НИХ ПЕРЕНОСИТСЯ НА ДВЕ СТРОКИ.
     ЖИВОЕ ЗАМЕЧАНИЕ REN: «Whose %» умещался в строку, «Sharp money» переносился - и первая
     подпись стояла посередине кнопки, а вторая начиналась сверху. Лечится не укорачиванием
     слов (оно вернётся на следующем языке), а вертикальным центрированием: flex + одинаковая
     минимальная высота держат ряд ровным при любой длине подписи. */
  .tab{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
       min-height:46px;padding:7px 4px;border:1px solid var(--line);border-radius:12px;
       background:var(--card);color:var(--dim);text-align:center;font-size:12.5px;
       line-height:1.15;cursor:pointer}
  .tab.on{color:var(--ink);border-color:var(--nsn);background:#261a4e;
          box-shadow:0 0 0 1px rgba(0,211,149,.25) inset}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:12px;margin:10px 0;box-shadow:0 8px 24px rgba(8,2,24,.35)}
  h1{font-size:17px;margin:2px 0 8px}
  .lead{font-size:16px;line-height:1.35;margin:0 0 6px}
  .lead b{color:#fff}
  .dim{color:var(--dim);font-size:12.5px}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer}
  .row .nm{flex:0 0 42%;font-size:12.5px;white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis}
  .row .barwrap{flex:1;height:18px;background:var(--card2);border-radius:5px;overflow:hidden}
  .row .bar{height:100%}
  .row .val{flex:0 0 66px;text-align:right;font-size:12px;color:var(--dim)}
  .det{display:none;padding:6px 0 8px 8px;border-left:2px solid var(--line);
       margin:0 0 8px 6px;font-size:12.5px;color:var(--dim)}
  .det.on{display:block}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 2px;font-size:11.5px;
          color:var(--dim)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;
            margin-right:4px;vertical-align:-1px}
  .sides{display:flex;gap:8px;margin:8px 0}
  .side{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;
        padding:7px 9px;font-size:12.5px}
  .foot{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;
        font-size:11.5px;color:var(--dim)}
  /* «Source: Nansen» В ПОДВАЛЕ ОКРАШЕН В ИХ ЗЕЛЁНЫЙ - источник обязан быть заметен. */
  .foot .src{color:var(--nsn);font-weight:600}
  .cav{margin:6px 0 0;padding-left:16px}
  .cav li{margin:2px 0}
  .said{white-space:pre-wrap;font-size:12px;color:#cfc4ee;background:var(--card2);
        border:1px solid var(--line);border-left:3px solid var(--nsn-d);
        border-radius:10px;padding:9px;margin-top:8px;max-height:210px;overflow:auto}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
  .btn{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#261a4e;
       color:var(--ink);font-size:13px;cursor:pointer}
  .btn.on{border-color:var(--nsn);color:#fff;box-shadow:0 0 0 1px rgba(0,211,149,.25) inset}
  input.mk{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);
           background:var(--card2);color:var(--ink);font-size:14px}
  /* РЯД РЫНКА: вопрос крупно, вероятность и объём мелко. Идентификатора в разметке для глаз
     нет вовсе - он лежит в data-атрибуте и нужен только тапу. */
  .mkrow{padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .mkrow:last-child{border-bottom:0}
  .mkq{font-size:14px;line-height:1.3}
  .mkmeta{font-size:11.5px;color:var(--dim);margin-top:2px}
  /* ПОЛОСЫ В РЯДУ РЫНКА. ПОЙМАНО РЕНДЕРОМ: стили полос были объявлены только как `.row .barwrap`,
     а экран острых денег строит их внутри `.mkrow` - высота не задавалась, и полос НЕ БЫЛО ВИДНО
     ВООБЩЕ. Легенда при этом обещала два цвета: экран обещал сравнение и не показывал его. */
  .mkrow .barwrap{height:8px;background:var(--card2);border-radius:5px;overflow:hidden;
                  margin-top:3px}
  .mkrow .bar{height:100%}
  .warn{background:#3a2a10;border:1px solid #7a5a1a;color:#ffe2b0;border-radius:12px;
        padding:9px 11px;font-size:12.5px;margin:10px 0}
  .bad{background:#3a1526;border:1px solid #7a2540;color:#ffc9d6}
  /* ПЛАШКА РЕПЕТИЦИИ НЕСВОДИМА: она рисуется по полю ИЗ ОТВЕТА шлюза, а не по флагу
     страницы, и спрятать её нельзя, не правя код. В финальной записи репетиция запрещена,
     поэтому плашка в кадре означает «дубль переснять». */
  .reh{position:sticky;top:52px;z-index:6;background:#4a3606;border:1px solid #b08a14;
       color:#ffe9a8;border-radius:12px;padding:8px 11px;margin:8px 12px;font-size:12.5px;
       font-weight:600;text-align:center}
  table.feed{width:100%;border-collapse:collapse;font-size:11.5px}
  table.feed td{padding:4px 3px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.feed td.ep{white-space:normal;color:#cfc4ee}
  .pill{display:inline-block;padding:1px 6px;border-radius:20px;font-size:10.5px}
  .p-ok{background:#0d3b2c;color:#6ff0c2} .p-cache{background:#3a3410;color:#f0e58f}
  .p-bad{background:#3d1220;color:#ffb3c4}
  .tot{display:flex;gap:8px;margin:2px 0 10px}
  .tot div{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;
           padding:7px;text-align:center}
  .tot b{display:block;font-size:17px;color:var(--nsn)}
  /* ГРАФИКИ ТЯНУТСЯ НА ВСЮ ШИРИНУ КАРТОЧКИ - но только они. ПОЙМАНО РЕНДЕРОМ: это правило
     было записано на ВСЕ svg, и знак в шапке (22×22 по атрибутам) растянулся на 380 пикселей,
     разорвав ширину страницы. Атрибуты width/height у svg слабее любого CSS, поэтому знаку
     нужен свой селектор С КЛАССОМ - `svg.mark` (0,1,1) перебивает `svg` (0,0,1) без !important. */
  svg{display:block;width:100%;height:auto;overflow:visible}
  svg.mark{width:22px;height:22px;flex:0 0 22px}
</style>
</head>
<body>

<!--
  ШАПКА. Слева чей это экран, справа - ЧЬИ ДАННЫЕ, и второе не украшение: экран показывают
  судьям конкурса, и источник обязан быть виден без чтения подвала.

  ЗНАК НАРИСОВАН НАМИ, А НЕ СКОПИРОВАН. Официального SVG Nansen в открытом виде под лицензией,
  позволяющей положить файл в ПУБЛИЧНЫЙ репозиторий, найти не удалось, а тащить чужой logo-файл
  со стороннего агрегатора «потому что похоже» - это ровно та тихая проблема, которую потом
  находит не автор. Поэтому здесь геометрический знак в их зелёном плюс словесная марка и
  ссылка на источник. Появится официальный файл (или разрешение) - меняется одна строка:
  положить `nansen-logo.svg` рядом и подставить <img> вместо <svg> ниже.
-->
<div class="top">
  <svg class="mark" width="24" height="24" viewBox="0 0 48 48" aria-hidden="true">
    <!-- ЧЕТЫРЕ ИЗОГНУТЫХ ЛЕПЕСТКА «ВЕРТУШКОЙ» - форма по знаку, который прислал владелец.
         Нарисовано нами кривыми, а не вставлено файлом: см. комментарий выше про лицензию. -->
    <g fill="none" stroke="#00d395" stroke-width="3.4" stroke-linecap="round">
      <path d="M24 24 C18 17 16 9 21 5 C26 9 25 17 24 24 Z"/>
      <path d="M24 24 C31 18 39 16 43 21 C39 26 31 25 24 24 Z"/>
      <path d="M24 24 C30 31 32 39 27 43 C22 39 23 31 24 24 Z"/>
      <path d="M24 24 C17 30 9 32 5 27 C9 22 17 23 24 24 Z"/>
    </g>
  </svg>
  <span class="ttl">Undertaker</span>
  <a class="by" href="https://www.nansen.ai" target="_blank" rel="noopener noreferrer">
    data by <b>NANSEN</b></a>
</div>

<div class="tabs">
  <!-- ПОДПИСИ КОРОТКИЕ И В ОДНУ СТРОКУ КАЖДАЯ. Длинные («Sharp money», «Liquidations») на
       узком экране переносились, и ряд табов выглядел ступеньками - замечание владельца.
       Вертикальное центрирование уже стоит в CSS, но ровнее всего ряд смотрится, когда ни одна
       подпись не переносится вовсе. Смысл не теряется: под каждым табом первым делом стоит
       заголовок экрана, который и объясняет, что это. -->
  <div class="tab on" id="t_hero">🎭&nbsp;Whose&nbsp;%</div>
  <div class="tab" id="t_sharp">🎯&nbsp;Sharp</div>
  <div class="tab" id="t_liq">🗺&nbsp;Map</div>
  <div class="tab" id="t_more">➕&nbsp;More</div>
  <div class="tab" id="t_feed">📡&nbsp;Live</div>
</div>

<div id="rehbar"></div>

<div class="wrap">
  <div id="scr_hero"></div>
  <div id="scr_sharp" style="display:none"></div>
  <div id="scr_liq" style="display:none"></div>
  <div id="scr_more" style="display:none"></div>
  <div id="scr_feed" style="display:none"></div>
</div>

<script>
(function () {
'use strict';
var TG = window.Telegram && window.Telegram.WebApp;
try { if (TG) { TG.ready(); TG.expand(); } } catch (e) {}

function qp(k) {
  try {
    var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  } catch (e) { return ''; }
}

var VERSION = '{{VERSION}}';

/* АДРЕС ЯЩИКА: параметр ?api выигрывает у вшитого. Так одна и та же страница работает и с
   прода, и со стенда - ровно как в Медиаплеере, и по той же причине. */
var API_BASE = (function () {
  var p = (qp('api') || '').trim();
  if (p.indexOf('https://') === 0) return p.replace(/\/+$/, '');
  var baked = '{{API}}';
  return baked.indexOf('{{') === 0 ? '' : baked.replace(/\/+$/, '');
})();

var REHEARSAL = (qp('rehearsal') === '1' || qp('reh') === '1');

/* ЧЕГО НЕ ХВАТАЕТ ДЛЯ ЖИВОГО ЭКРАНА. Две причины - два действия, и сводить их в один
   bool значит отправить человека чинить не то (разбор в Медиаплеере стоил полдня). */
function offWhy() {
  try {
    if (!API_BASE) return 'noapi';
    if (!(TG && TG.initData)) return 'nosign';
    return '';
  } catch (e) { return 'nosign'; }
}

var SIG_STEPS = [500, 700, 900, 1200, 1600, 2000];
var SIG_TRIES = 45;

function sigPost(body) {
  /* ОТКАЗ НЕСЁТ ФАКТЫ, А НЕ НАСТРОЕНИЕ: куда шли, чем ответили, что сказали. Иначе
     «не получилось» одинаково выглядит у блокировки CORS и у мёртвой сети. */
  body = body || {};
  body.kind = 'nsn';
  return fetch(API_BASE + '/signal', {
    method: 'POST',
    headers: { 'X-Init-Data': (TG && TG.initData) || '', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      j = j || {};
      if (!r.ok && !j.error) { j.error = 'http' + r.status; }
      j.__http = r.status;
      return j;
    });
  }).catch(function (e) {
    return { error: 'net', __net: String((e && e.message) || e).slice(0, 60) };
  });
}

function sigPoll(id, n, done, fail) {
  if (n > SIG_TRIES) { fail('slow'); return; }
  setTimeout(function () {
    fetch(API_BASE + '/result?id=' + encodeURIComponent(id),
          { headers: { 'X-Init-Data': (TG && TG.initData) || '' } })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.state === 'done') { done(j.res || {}); return; }
        if (j && j.state === 'gone') { fail('gone'); return; }
        sigPoll(id, n + 1, done, fail);
      })
      .catch(function () { sigPoll(id, n + 1, done, fail); });
  }, SIG_STEPS[Math.min(n, SIG_STEPS.length - 1)]);
}

/* ЛОКАЛЬНАЯ ФИКСТУРА: РЕПЕТИЦИЯ БЕЗ ЯЩИКА, БЕЗ КЛЮЧА И БЕЗ TELEGRAM.
   ЗАЧЕМ ЭТА ВЕТКА. Судье на чистой машине нужно увидеть экран за минуту: `git clone`,
   статический сервер, открыть. Ни ключа Nansen, ни подписи Telegram у него нет и быть не
   должно. Поэтому при `?rehearsal=1` сначала пробуем ФАЙЛ рядом со страницей, и только если
   его нет - идём в ящик с флагом репетиции (этот путь нужен Рену на телефоне).
   Пометка `rehearsal` приезжает В САМОМ ФАЙЛЕ, поэтому плашка рисуется и здесь: локальный
   просмотр не имеет права выглядеть живым прогоном. */
function localFixture(scene, done) {
  fetch('fixtures/' + encodeURIComponent(scene) + '.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { done(j || null); })
    .catch(function () { done(null); });
}

/* ОДНА ДВЕРЬ К СЦЕНЕ: попросить и дождаться. Ответ - конверт сцены как есть. */
function askScene(fields, done) {
  if (REHEARSAL && fields.sc && fields.sc !== 'feed') {
    localFixture(fields.sc, function (env) {
      if (env) { done(env); return; }
      askLive(fields, done);        /* файла нет - пробуем ящик с флагом репетиции */
    });
    return;
  }
  askLive(fields, done);
}

function askLive(fields, done) {
  var why = offWhy();
  if (why) {
    done({ outcome: 'nokey', refusal: why === 'nosign'
           ? 'Open this screen from Telegram: the signature is missing.'
           : 'The screen has no gateway address yet. Reopen it from a fresh bot link.' });
    return;
  }
  if (REHEARSAL) { fields.rh = 1; }
  sigPost(fields).then(function (j) {
    if (!j || j.error || !j.id) {
      var host = '';
      try { host = new URL(API_BASE).host; } catch (e) { host = API_BASE || '?'; }
      done({ outcome: 'http', refusal: 'Request did not go out [' + host
             + ((j && j.__http) ? ' ' + j.__http : '')
             + ((j && j.__net) ? ' ' + j.__net : '') + ']' });
      return;
    }
    sigPoll(j.id, 0, done, function (why2) {
      done({ outcome: 'timeout', refusal: why2 === 'slow'
             ? 'The bot is still counting. Try again in a moment.'
             : 'The answer was already taken. Tap again.' });
    });
  });
}

/* ── формат чисел. ЕДИНСТВЕННАЯ АРИФМЕТИКА НА СТРАНИЦЕ - ЭТО ФОРМАТ, А НЕ СМЫСЛ ── */
function usd(v) {
  if (v === null || v === undefined || v === '') return '?';
  var n = Number(v);
  if (!isFinite(n)) return '?';
  var a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (a >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n.toFixed(0);
}
function price(v) {
  var n = Number(v);
  if (!isFinite(n)) return '?';
  if (Math.abs(n) >= 1000) return usd(n);
  return n.toFixed(2);
}
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
/* ЦВЕТ ЧИТАЕТСЯ ИЗ CSS, А НЕ ДУБЛИРУЕТСЯ ШЕСТНАДЦАТИРИЧНЫМ ЧИСЛОМ В КОДЕ.
   ЗАЧЕМ ВООБЩЕ. Графики раньше красились через `fill="var(--long)"`, и на экране это работает.
   Но карту теперь можно СОХРАНИТЬ КАРТИНКОЙ (просьба владельца), а внутри отдельного файла
   переменных страницы уже нет: `var(--long)` в вынутом SVG превращается в «цвета нет», и
   сохранённый файл вышел бы чёрно-белым. Вписать числа руками значило бы завести ВТОРОЙ
   источник палитры и однажды нарисовать лонги одним цветом на экране и другим в файле -
   ровно тот класс молчаливого расхождения, против которого Закон 0. Поэтому цвет берётся
   у самой страницы и попадает в разметку числом. */
var _CSSV = {};
function cssv(name, fb) {
  if (_CSSV[name] !== undefined) return _CSSV[name];
  var v = '';
  try {
    v = getComputedStyle(document.documentElement).getPropertyValue(name) || '';
  } catch (e) { v = ''; }
  v = String(v).trim();
  _CSSV[name] = v || fb;
  return _CSSV[name];
}
/* ФРАЗА БОТА ПОКАЗЫВАЕТСЯ ТЕКСТОМ, А НЕ РАЗМЕТКОЙ: теги Telegram (<b>, <code>, <i>)
   снимаем, содержимое оставляем. Вставлять чужую разметку в DOM незачем. */
function plain(s) {
  return String(s || '').replace(/<[^>]*>/g, '');
}
function ago(sec) {
  if (sec === null || sec === undefined) return 'freshness not measured';
  var n = Math.round(Number(sec));
  if (!isFinite(n)) return 'freshness not measured';
  if (n < 60) return n + 's ago';
  if (n < 3600) return Math.round(n / 60) + 'm ago';
  return Math.round(n / 3600) + 'h ago';
}

/* ПОДВАЛ ЭКРАНА: источник, свежесть, цена, оговорки. ОБЯЗАТЕЛЕН НА КАЖДОМ ЭКРАНЕ - цифра
   без источника и возраста выглядит как наше собственное знание неизвестной давности. */
function footer(env) {
  var cost = (env.cost_credits === null || env.cost_credits === undefined)
    ? ((env.cost_requests || 0) + ' request' + ((env.cost_requests === 1) ? '' : 's'))
    : ((env.cost_credits) + ' credits · ' + (env.cost_requests || 0) + ' requests');
  var h = '<div class="foot">Source: <span class="src">' + esc(env.source || 'Nansen')
        + '</span> · ' + esc(ago(env.freshness_seconds)) + ' · ' + esc(cost);
  if (env.cost_credits === null || env.cost_credits === undefined) {
    h += '<br><span class="dim">Credit price is not published for these endpoints, so the '
       + 'cost is named in requests.</span>';
  }
  var cav = env.caveats || [];
  if (cav.length) {
    h += '<ul class="cav">';
    for (var i = 0; i < cav.length; i++) h += '<li>' + esc(cav[i]) + '</li>';
    h += '</ul>';
  }
  if (env.rendered_text) {
    h += '<div class="dim" style="margin-top:8px">What the bot says in chat, verbatim:</div>'
       + '<div class="said">' + esc(plain(env.rendered_text)) + '</div>';
  }
  return h + '</div>';
}

function refuse(env) {
  /* СОСТОЯНИЕ, А НЕ ПУСТОЙ ГРАФИК. Шесть нулевых столбиков выглядят как измерение и врут
     сильнее, чем отсутствие картинки, поэтому при отказе рисуется ПРИЧИНА. */
  return '<div class="card"><div class="warn bad"><b>' + esc(env.outcome || 'error')
       + '</b><br>' + esc(plain(env.refusal || 'No reason given.')) + '</div>'
       + '<div class="dim">This is a state, not an empty chart: a blank graph would look '
       + 'like a measurement.</div></div>';
}

function loading(what) {
  return '<div class="card"><div class="dim">' + esc(what) + '</div></div>';
}

/* ═══════════════════════════════════════════════════════════════════════════
   ЭКРАН 1. «ЧЬИ ЭТО ДЕНЬГИ» — состав убеждённости рынка
   ═══════════════════════════════════════════════════════════════════════════ */
var HERO = { market: (qp('market') || qp('mk') || ''), env: null, open: -1, list: null,
             pick: null,
             /* «КТО В РЫНКЕ И С КАКИМ PnL» ЖИВЁТ ЗДЕСЬ, А НЕ ОТДЕЛЬНЫМ ТАБОМ, И ЭТО ГЛАВНОЕ В
                НЁМ. Экрану нужен номер рынка, и единственный честный способ его получить -
                взять у УЖЕ ОТКРЫТОЙ карточки. Живое замечание владельца: «я смотрю опять
                идентификатор маркет заставляешь искать юзера». Отдельный таб неизбежно снова
                спрашивал бы номер, потому что при входе в него рынок не выбран. */
             pos: null, posOn: false, posBusy: false };

/* СБРОС РАЗБОРА ПРИ СМЕНЕ РЫНКА - ОДНОЙ ФУНКЦИЕЙ, А НЕ ТРЕМЯ КОПИЯМИ. В hero приходят из трёх
   мест (список рынков, экран острых денег, кнопка «назад»), и забыть обнулить один экран из
   двух - значит показать держателей ПРОШЛОГО рынка под вопросом нового. Класс бага: состояние
   сбрасывается в нескольких местах, и одно из них однажды отстаёт. */
function heroReset() {
  HERO.env = null; HERO.open = -1; HERO.pos = null; HERO.posOn = false;
}

function posHTML(env) {
  if (!env) return loading('Reading who is in this market…');
  if (env.outcome !== 'ok' || !env.payload) return refuse(env);
  var p = env.payload, rows = p.rows || [];
  var h = '<div class="card"><h1>Who is in it, and how it is going for them</h1>'
        + '<div class="dim">The screen above is whose money this is — lifetime win rate. This '
        + 'one is what is happening to them HERE: entry price, and how much they are up or '
        + 'down in THIS market.</div>';
  if (p.title) { h += '<div class="dim"><i>' + esc(p.title) + '</i></div>'; }
  if (p.resolved === true) {
    h += '<div class="warn">This market is RESOLVED: the numbers are final, not open risk.'
       + '</div>';
  }
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var pnl = (r.pnl === null || r.pnl === undefined) ? null : Number(r.pnl);
    h += '<div class="mkrow"><div class="mkq">' + esc(r.who)
       + ' <span class="dim">[' + esc(r.side) + ']</span>'
       + (pnl === null ? ''
          : (' · <b style="color:' + (pnl >= 0 ? 'var(--strong)' : 'var(--weak)') + '">'
             + (pnl >= 0 ? '+$' : '−$') + usd(Math.abs(pnl)) + '</b>'))
       + '</div>';
    h += '<div class="mkmeta">'
       + (pnl === null ? 'PnL did not arrive for this holder — NOT counted in the total below'
          : 'PnL in this market')
       + (r.entry !== null && r.entry !== undefined && r.px !== null && r.px !== undefined
          ? (' · entry ' + Math.round(r.entry) + '¢ → ' + Math.round(r.px) + '¢') : '')
       + (r.open_usd ? (' · open $' + usd(r.open_usd)) : '')
       + '</div></div>';
  }
  /* ИТОГ - ВЕЛИЧИНОЙ, И СЧИТАЕТ ЕГО БОТ. Страница печатает `net_pnl` из словаря: сложи она
     сама, и «в сумме» в чате разошлось бы с «в сумме» на картинке. */
  var np = Number(p.net_pnl || 0);
  h += '<div class="dim" style="margin-top:6px">Net PnL of the ' + (p.shown || 0)
     + ' holder(s) shown: <b>' + (np >= 0 ? '+$' : '−$') + usd(Math.abs(np))
     + '</b>. This is their result in THIS market, not their lifetime record.</div>';
  h += footer(env) + '</div>';
  return h;
}

function posLoad() {
  HERO.posBusy = true;
  askScene({ sc: 'pm_positions', mk: HERO.market, lg: 'en' }, function (env) {
    HERO.pos = env; HERO.posBusy = false; showReh(env); heroRender();
  });
}

/* ЧЕМ НАЗЫВАТЬ ВЫБРАННЫЙ РЫНОК. Строка берётся ИЗ УЖЕ ПРИЕХАВШЕГО СЛОВАРЯ списка (сцена
   `pm_markets`), а не сочиняется: вопрос рынка и его процент - измеренные поля, и других у
   страницы нет. Открыли экран ссылкой с `?market=` - списка не было, вернём null, и тогда
   заголовок не притворяется знающим, чей это рынок. */
function heroPicked() {
  if (!HERO.market) return null;
  /* ВЫБРАННАЯ СТРОКА ЗАПОМИНАЕТСЯ ПРИ ТАПЕ, и это не кэш ради скорости: в hero можно прийти
     не только из списка рынков, но и с экрана острых денег, где своего списка у hero нет.
     Без этой памяти заголовок терял бы вопрос рынка ровно на втором пути входа. */
  if (HERO.pick && String(HERO.pick.id) === String(HERO.market)) return HERO.pick;
  return heroRowById(HERO.list, HERO.market);
}

/* Строка рынка по id В ЛЮБОМ конверте, у которого есть `payload.rows` (список рынков или
   экран острых денег): оба несут одни и те же поля `id/q/prob`, потому что оба собраны из
   одного словаря скринера. Один резолвер на два входа - чтобы заголовок hero не зависел от
   того, откуда пришли. */
function heroRowById(env, id) {
  var rows = (env && env.payload && env.payload.rows) || [];
  for (var i = 0; i < rows.length; i++) {
    if (String(rows[i].id) === String(id)) return rows[i];
  }
  return null;
}

function wrBucket(h) {
  /* ЦВЕТ = КОРЗИНА ВИНРЕЙТА, а серый = ИСТОРИЯ НЕ РАЗОБРАНА. Серый не суммируется ни в
     одну сторону, и легенда это говорит словами: приписать кошельку винрейт, которого мы
     не знаем, значит подогнать вывод. Порог приезжает числом из словаря. */
  if (h.wr === null || h.wr === undefined) return 'grey';
  var thr = (HERO.env && HERO.env.threshold_weak_wr) || 40;
  /* ВЕРХНИЙ ПОРОГ ТОЖЕ ИЗ СЛОВАРЯ. Здесь стояло зашитое 60: страница красила столбик зелёным
     по числу, которого бот не знал ни в одном тексте - то есть у экрана и у бота было по
     своему определению «сильного» кошелька. Теперь оба читают `PM_SHARP_WR`. */
  var thrUp = (HERO.env && HERO.env.threshold_strong_wr) || 60;
  if (Number(h.wr) < thr) return 'weak';
  if (Number(h.wr) < thrUp) return 'mid';
  return 'strong';
}

function heroHTML(env) {
  if (!env) return loading('Asking Nansen…');
  if (env.outcome !== 'ok' || !env.payload) return refuse(env);
  var p = env.payload, thr = env.threshold_weak_wr || 40;
  var weak = Number(p.weak_usd || 0), strong = Number(p.strong_usd || 0);
  var known = weak + strong;
  var pct = known ? Math.round(100 * weak / known) : 0;
  var h = '<div class="card">';
  /* ЗАГОЛОВОЧНАЯ СТРОКА - ВЕЛИЧИНА, И ОНА ПЕРВАЯ. Числа из словаря, ни одного своего. */
  h += '<p class="lead">Of <b>$' + usd(known) + '</b> examined, <b>$' + usd(weak)
     + ' (' + pct + '%)</b> sits with wallets whose win rate is below ' + thr + '%.</p>';
  /* СЛУЖЕБНЫЙ НОМЕР РЫНКА ПОКАЗЫВАЕМ ТОЛЬКО ТОГДА, КОГДА НАЗВАТЬ РЫНОК БОЛЬШЕ НЕЧЕМ. Список
     рынков прячет его нарочно (он служебный), и печатать его тут же под заголовком значило
     бы прятать в одном месте и выставлять в другом. Пришли по ссылке без списка - номер
     остаётся единственным опознавательным знаком, и промолчать о нём было бы хуже. */
  if (!heroPicked()) {
    h += '<div class="dim">market <code>' + esc(env.market_id || HERO.market) + '</code></div>';
  }

  var sides = p.by_side || {}, sk = Object.keys(sides);
  if (sk.length) {
    h += '<div class="sides">';
    for (var s = 0; s < Math.min(sk.length, 3); s++) {
      h += '<div class="side"><b>' + esc(sk[s]) + '</b><br>$' + usd(sides[sk[s]]) + '</div>';
    }
    h += '</div>';
  }

  var hs = (p.holders || []).slice(0, env.top || 5);
  var max = 0, i;
  for (i = 0; i < hs.length; i++) max = Math.max(max, Number(hs[i].usd || 0));
  h += '<div class="dim" style="margin-top:6px">Holders (' + hs.length + ' of '
     + (p.holders || []).length + ' examined) — area is money, colour is win rate:</div>';
  for (i = 0; i < hs.length; i++) {
    var x = hs[i], b = wrBucket(x);
    var w = max ? Math.max(3, Math.round(100 * Number(x.usd || 0) / max)) : 3;
    h += '<div class="row" data-h="' + i + '">'
       + '<div class="nm">' + esc(x.who || '?') + ' <span class="dim">['
       + esc(x.side || '?') + ']</span></div>'
       + '<div class="barwrap"><div class="bar" style="width:' + w + '%;background:var(--'
       + b + ')"></div></div>'
       + '<div class="val">$' + usd(x.usd) + '</div></div>';
    h += '<div class="det' + (HERO.open === i ? ' on' : '') + '" id="det' + i + '">'
       + (x.wr === null || x.wr === undefined
          ? 'History not examined — this money is counted on NEITHER side.'
          : ('win rate ' + Math.round(x.wr) + '%'))
       + (x.pnl !== null && x.pnl !== undefined ? ' · PnL $' + usd(x.pnl) : '')
       + (x.markets ? ' · ' + x.markets + ' markets' : '')
       + (x.entry !== null && x.entry !== undefined && x.px !== null && x.px !== undefined
          ? ' · entry ' + Math.round(x.entry * 100) + '¢ → ' + Math.round(x.px * 100) + '¢'
          : '')
       + (x.status && x.status !== 'ok' ? ' · ' + esc(x.status) : '')
       + '</div>';
  }
  var thrUp2 = env.threshold_strong_wr || 60;
  h += '<div class="legend">'
     + '<span><i style="background:var(--weak)"></i>below ' + thr + '%</span>'
     + '<span><i style="background:var(--mid)"></i>' + thr + '–' + thrUp2 + '%</span>'
     + '<span><i style="background:var(--strong)"></i>above ' + thrUp2 + '%</span>'
     + '<span><i style="background:var(--grey)"></i>history not examined — counted on '
     + 'NEITHER side</span></div>';
  h += '<div class="dim" style="margin-top:6px">This is the composition of conviction, '
     + 'not a prediction and not advice.</div>';
  h += footer(env) + '</div>';
  return h;
}

/* СПИСОК РЫНКОВ - ЭТО И ЕСТЬ ВХОД. Идентификатор рынка человеку показывать незачем: он
   служебный, и требовать его значило бы отправить человека искать номер на стороне Polymarket,
   то есть заставить работать ВНЕ экрана. Здесь он ездит в `data-mk` и нигде не виден. */
function marketsHTML() {
  if (!HERO.list) return loading('Loading trending markets…');
  if (HERO.list.outcome !== 'ok' || !HERO.list.payload) return refuse(HERO.list);
  var rows = HERO.list.payload.rows || [];
  var h = '<div class="card"><div class="dim">Tap a market — I will show whose money is '
        + 'behind its price.</div>';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var dis = r.id ? '' : ' style="opacity:.45"';
    h += '<div class="mkrow"' + dis + (r.id ? ' data-mk="' + esc(r.id) + '"' : '') + '>'
       + '<div class="mkq">' + esc(r.q) + '</div>'
       + '<div class="mkmeta">' + (r.prob === null ? '?' : (r.prob + '%'))
       + ' · vol24 $' + usd(r.vol24)
       + (r.id ? '' : ' · <i>no id: cannot open</i>') + '</div></div>';
  }
  h += footer(HERO.list) + '</div>';
  return h;
}

function heroRender() {
  var el = document.getElementById('scr_hero');
  /* ЗАГОЛОВОК НЕ НАЗЫВАЕТ ЧИСЕЛ, КОТОРЫХ НЕ МЕРИЛ. Тут стояло «A market says 90% YES»
     НАГЛУХО - и висело над спортивным рынком, где цена 55%, а сторон вообще не YES/NO.
     Число в заголовке читается как измерение этого экрана, поэтому процент приезжает ТОЛЬКО
     из словаря выбранного рынка, а пока рынок не выбран - заголовок обходится без числа. */
  var pk = heroPicked();
  var h1 = pk ? esc(pk.q) : 'Whose conviction is behind a market price?';
  var sub = pk
    ? ((pk.prob === null || pk.prob === undefined)
       ? 'The market has no price in the response — the composition of the money is below.'
       : ('The market prices this at ' + esc(pk.prob) + '%. Whose conviction is that?'))
    : 'Price alone cannot tell a signal from a crowd. Pick a market.';
  var head = '<div class="card"><h1>' + h1 + '</h1>'
    + '<div class="dim">' + sub + '</div>'
    + (HERO.market
       ? ('<div class="btns"><span class="btn" id="mkback">« back to markets</span>'
          /* НОМЕР РЫНКА У ЭТОЙ КНОПКИ УЖЕ ЕСТЬ - ОН В СОСТОЯНИИ ЭКРАНА. Человеку его вводить
             не надо и видеть незачем: служебное поле ездит между экранами, а не через глаза. */
          + '<span class="btn' + (HERO.posOn ? ' on' : '') + '" id="posbtn">'
          + '🧾 who is in it, with PnL</span></div>')
       : '')
    + '</div>';
  // НИ ОДНОГО «Asking Nansen…» БЕЗ ЗАПРОСА. Раньше пустой экран показывал строку загрузки,
  // хотя ничего не спрашивал: человек ждал ответа, которого никто не просил.
  el.innerHTML = head
    + (HERO.market ? (heroHTML(HERO.env) + (HERO.posOn ? posHTML(HERO.pos) : ''))
                   : marketsHTML());
  var bk = document.getElementById('mkback');
  if (bk) {
    bk.onclick = function () {
      HERO.market = ''; heroReset(); heroRender();
    };
  }
  var pb = document.getElementById('posbtn');
  if (pb) {
    pb.onclick = function () {
      HERO.posOn = !HERO.posOn;
      heroRender();
      if (HERO.posOn && !HERO.pos && !HERO.posBusy) posLoad();
    };
  }
  var mk = el.querySelectorAll('.mkrow[data-mk]');
  for (var j = 0; j < mk.length; j++) {
    mk[j].onclick = (function (id) {
      return function () {
        HERO.market = id; heroReset();
        HERO.pick = heroRowById(HERO.list, id);
        heroRender();
        askScene({ sc: 'pm_reputation', mk: id, lg: 'en' }, function (env) {
          HERO.env = env; showReh(env); heroRender();
        });
      };
    })(mk[j].getAttribute('data-mk'));
  }
  var rows = el.querySelectorAll('.row[data-h]');
  for (var i = 0; i < rows.length; i++) {
    rows[i].onclick = (function (n) {
      return function () {
        HERO.open = (HERO.open === n ? -1 : n);
        var d = document.getElementById('det' + n);
        var all = el.querySelectorAll('.det');
        for (var k = 0; k < all.length; k++) { all[k].className = 'det'; }
        if (d && HERO.open === n) d.className = 'det on';
      };
    })(i);
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   ЭКРАН 1Б. ОСТРЫЕ ДЕНЬГИ — какой из разогретых рынков держат те, кто угадывал

   ЭКРАН СРАВНЕНИЯ, А НЕ РАЗБОРА. Hero отвечает «чьи деньги в ЭТОМ рынке», а выбирают между
   рынками: из десяти разогретых нужен тот, где против тебя стоят не случайные люди. Тап по
   строке открывает тот же hero - второго разбора рынка на странице нет и быть не должно.
   ═══════════════════════════════════════════════════════════════════════════ */
var SHARP = { env: null, busy: false };

function sharpHTML(env) {
  if (!env) return loading('Comparing markets — this screen costs a dozen requests…');
  if (env.outcome !== 'ok' || !env.payload) return refuse(env);
  var p = env.payload, rows = p.rows || [];
  var h = '<div class="card">';
  h += '<div class="dim">Sharp = wallets whose lifetime win rate is at or above '
     + esc(p.wr_sharp) + '%, weak = below ' + esc(p.wr_weak) + '%. Both thresholds come from '
     + 'the bot, not from this page. Tap a market to see who holds it.</div>';
  /* МАСШТАБ ОДИН НА ВСЕ СТРОКИ: у каждой свой - и рынок с $300K выглядел бы как рынок с $3M.
     Это ровно то сравнение, ради которого экран существует. */
  var max = 0, i;
  for (i = 0; i < rows.length; i++) {
    max = Math.max(max, Number(rows[i].sharp || 0), Number(rows[i].weak || 0));
  }
  for (i = 0; i < rows.length; i++) {
    var r = rows[i];
    var dis = r.id ? '' : ' style="opacity:.45"';
    h += '<div class="mkrow"' + dis + (r.id ? ' data-mk="' + esc(r.id) + '"' : '') + '>'
       + '<div class="mkq">' + esc(r.q) + '</div>';
    if (r.status !== 'ok') {
      h += '<div class="mkmeta"><i>holders were not delivered for this market</i></div></div>';
      continue;
    }
    var sw = max ? Math.max(2, Math.round(100 * Number(r.sharp || 0) / max)) : 2;
    var ww = max ? Math.max(2, Math.round(100 * Number(r.weak || 0) / max)) : 2;
    var ex = Number(r.examined || 0);
    var pct = ex ? Math.round(100 * Number(r.sharp || 0) / ex) : 0;
    /* СКОЛЬКО ДЕРЖАТЕЛЕЙ РАЗОБРАНО - В САМОЙ СТРОКЕ, А НЕ ТОЛЬКО В ОГОВОРКАХ. Живой прогон:
       на этом экране у рынка «$646.4K examined», а в hero того же рынка «$930.1K examined», и
       это не расхождение - сравнение смотрит 3 держателя на рынок, разбор смотрит 5. Но человек
       видит два числа и читает их как ошибку, если рядом не сказано, по скольким они считаны. */
    h += '<div class="mkmeta">' + (r.prob === null || r.prob === undefined
                                   ? '?' : (esc(r.prob) + '%'))
       + ' · sharp <b>$' + usd(r.sharp) + '</b> (' + pct + '% of $' + usd(ex)
       + ' examined across ' + esc(p.holders) + ' holders) vs weak $' + usd(r.weak) + '</div>'
       + '<div class="barwrap"><div class="bar" style="width:' + sw
       + '%;background:var(--strong)"></div></div>'
       + '<div class="barwrap"><div class="bar" style="width:' + ww
       + '%;background:var(--weak)"></div></div>';
    if (r.who) h += '<div class="mkmeta">biggest sharp holder: ' + esc(r.who) + '</div>';
    if (r.unknown_n) {
      h += '<div class="mkmeta">' + esc(r.unknown_n) + ' holder(s) here have no measurable '
         + 'win rate — on NEITHER side</div>';
    }
    h += '</div>';
  }
  h += '<div class="legend"><span><i style="background:var(--strong)"></i>sharp money</span>'
     + '<span><i style="background:var(--weak)"></i>weak money</span></div>';
  h += footer(env) + '</div>';
  return h;
}
